  get:(k,fb)=>{try{const v=localStorage.getItem(k);return v===null?fb:JSON.parse(v)}catch{return fb}},
  set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch{}},
  raw:(k)=>{try{return localStorage.getItem(k)}catch{return null}},
  setRaw:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}
};

const loadBags   = ()=>(ls.get(BAGS_KEY,[])||[]).filter(b=>b&&b.id&&b.date&&typeof b.amount==='number');

// ── Gist Sync ─────────────────────────────────────────────────────────────────
function useGistSync(){
  const [status,setStatus]=useState('idle');
  const [message,setMessage]=useState('');
  const [gistUrl,setGistUrl]=useState(()=>{const id=localStorage.getItem(GIST_ID_KEY);return id?`https://gist.github.com/${id}`:null});
  const setMsg=(s,m)=>{setStatus(s);setMessage(m)};

  const saveToGist=useCallback(async(pat)=>{
    if(!pat?.trim()){setMsg('error','No PAT provided.');return}
    setMsg('saving','Saving to Gist…');
    const data={};
    for(const k of DATA_KEYS){const v=ls.raw(k);if(v!==null)data[k]=v}
    const payload=JSON.stringify(data,null,2);
    const gistId=localStorage.getItem(GIST_ID_KEY);
    const headers={'Authorization':`Bearer ${pat.trim()}`,'Content-Type':'application/json','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
    const body=JSON.stringify({description:'FrostStash data',public:false,files:{[GIST_FILE]:{content:payload}}});
    try{
      let res,json;
      if(gistId){res=await fetch(`https://api.github.com/gists/${gistId}`,{method:'PATCH',headers,body});json=await res.json()}
      else{res=await fetch('https://api.github.com/gists',{method:'POST',headers,body});json=await res.json();if(json.id){localStorage.setItem(GIST_ID_KEY,json.id);setGistUrl(`https://gist.github.com/${json.id}`)}}
      res.ok?setMsg('saved',`Saved! ${new Date().toLocaleTimeString()}`):setMsg('error',json.message||`Error ${res.status}`);
    }catch(err){setMsg('error',err.message)}
  },[]);

  const loadFromGist=useCallback(async(pat,gistIdOverride)=>{
    if(!pat?.trim()){setMsg('error','No PAT provided.');return}
    setMsg('loading','Loading from Gist…');
    const gistId=gistIdOverride?.trim()||localStorage.getItem(GIST_ID_KEY);
    if(!gistId){setMsg('error','No Gist ID. Save first or paste your Gist ID.');return}
    const headers={'Authorization':`Bearer ${pat.trim()}`,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};
    try{
      const res=await fetch(`https://api.github.com/gists/${gistId}`,{headers});
      const json=await res.json();
      if(!res.ok){setMsg('error',json.message||`Error ${res.status}`);return}
      const file=json.files?.[GIST_FILE];
      if(!file){setMsg('error','No froststash-data.json found in Gist.');return}
      const data=JSON.parse(file.content);
      for(const k of DATA_KEYS){if(data[k]!==undefined)ls.setRaw(k,data[k])}
      localStorage.setItem(GIST_ID_KEY,gistId);
      setGistUrl(`https://gist.github.com/${gistId}`);
      setMsg('loaded',`Loaded! Reload the page to see your data.`);
    }catch(err){setMsg('error',err.message)}
  },[]);

  return{status,message,gistUrl,saveToGist,loadFromGist,clearStatus:()=>setMsg('idle','')};
}

// ── DairyBar CSV Import ───────────────────────────────────────────────────────
function parseDairyBarCSV(text) {
  const lines = text.trim().split('\n');
  const imported = [];
  const skipped  = [];

  for (let i = 1; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;

    // Split carefully — some fields have spaces
    const cols = line.split(',');
    const datePumped = (cols[0] || '').trim();
    const amountRaw  = (cols[2] || '').trim();
    const storage    = (cols[3] || '').trim().toLowerCase();
    const usedRaw    = (cols[5] || '').trim().toLowerCase();
    const dateUsedRaw= (cols[6] || '').trim();
    const note       = (cols[8] || '').trim();

    // Only import freezer bags
    if (storage !== 'freezer') { skipped.push({ reason: 'not freezer', line: i+1 }); continue; }

    // Parse date: M/D/YY → YYYY-MM-DD
    if (!datePumped) { skipped.push({ reason: 'no date', line: i+1 }); continue; }
    const dp = datePumped.split('/');
    if (dp.length < 3) { skipped.push({ reason: 'bad date', line: i+1 }); continue; }
    const m  = dp[0].padStart(2,'0');
    const d  = dp[1].padStart(2,'0');
    const yr = dp[2].length === 2 ? '20' + dp[2] : dp[2];
    const isoDate = `${yr}-${m}-${d}`;

    const amount = parseFloat(amountRaw);
    if (isNaN(amount) || amount <= 0) { skipped.push({ reason: 'bad amount', line: i+1 }); continue; }

    // Parse used date if present
    let usedDate = undefined;
    if (usedRaw === 'true' && dateUsedRaw && dateUsedRaw !== 'undefined') {
      try {
        const ud = new Date(dateUsedRaw);
        if (!isNaN(ud.getTime())) {
          usedDate = ud.toISOString().split('T')[0];
        }
      } catch {}
    }

    imported.push({
      id:       crypto.randomUUID(),
      date:     isoDate,
      amount:   amount,
      label:    '',
      notes:    note,
      brickId:  null,
      usedDate: usedDate,
    });
  }

  return { imported, skipped };
}

function ImportPanel({ onImport }) {
  const [status, setStatus] = useState(null);
  const [open,   setOpen]   = useState(false);

  const handleFile = (ev) => {
    const file = ev.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (re) => {
      const { imported, skipped } = parseDairyBarCSV(re.target.result);
      if (!imported.length) {
        setStatus({ type: 'err', msg: 'No freezer bags found in file.' });
        return;
      }
      onImport(imported);
      setStatus({
        type: 'ok',
        msg: `✓ Imported ${imported.length} bags${skipped.length ? ` (${skipped.length} skipped — fridge/invalid)` : ''}.`
      });
    };
    reader.readAsText(file);
    // reset so same file can be re-selected
    ev.target.value = '';
  };

  return div({ marginBottom: 18 },
    btn({ ...S.btnSecondary, fontSize: 13 }, () => setOpen(o => !o), `📥 Import CSV ${open ? '▲' : '▼'}`),
    open && div(S.syncPanel,
      e('h3', { style: { margin: '0 0 8px', fontSize: 16, fontWeight: 700 } }, 'Import from DairyBar'),
      e('p', { style: { margin: '0 0 14px', fontSize: 13, color: '#456070', lineHeight: 1.5 } },
        'Upload your DairyBar export CSV. Only ', e('strong', null, 'Freezer'), ' bags will be imported. Fridge entries are skipped. Duplicates are ', e('strong', null, 'not'), ' checked — import once.'
      ),
      e('label', { style: { ...S.lbl, cursor: 'pointer' } },
        e('span', { style: { display: 'inline-block', background: '#1a6fa8', color: '#fff', borderRadius: 9, padding: '9px 18px', fontSize: 13, fontWeight: 700, cursor: 'pointer', width: 'fit-content' } }, '📂 Choose CSV file'),
        e('input', { type: 'file', accept: '.csv', style: { display: 'none' }, onChange: handleFile })
      ),
      status && e('p', { style: { fontSize: 13, fontWeight: 600, color: status.type === 'err' ? '#f26b6b' : '#4dba85', margin: '12px 0 0' } }, status.msg)
    )
  );
}

  const [bricks,setBricks]=useState(loadBricks);
  const [panel,setPanel]=useState(null);
  const [bagForm,setBagForm]=useState(BLANK_BAG_FORM);
  const [brickForm,setBrickForm]=useState(BLANK_BRICK_FORM);
  const [filter,setFilter]=useState('active');
  const [typeFilter,setTypeFilter]=useState('all');
  const [sortBy,setSortBy]=useState('date');
  const [deleteTarget,setDeleteTarget]=useState(null);
  const [markUsedId,setMarkUsedId]=useState(null);
  const [expandBrick,setExpandBrick]=useState(null);
  const [toast,setToast]=useState(null);
  const [goal,setGoal]=useState(()=>ls.get(GOAL_KEY,2280));
  const [editGoal,setEditGoal]=useState(false);
  const [goalInput,setGoalInput]=useState('');
  const {status:syncStatus,message:syncMsg,gistUrl,saveToGist,loadFromGist,clearStatus}=useGistSync();

  const saveBags  =b=>{setBags(b);ls.set(BAGS_KEY,b)};
  const saveBricks=b=>{setBricks(b);ls.set(BRICK_KEY,b)};
  const toast_=(msg,type='ok')=>{setToast({msg,type});setTimeout(()=>setToast(null),2800)};

  const [dailyOz,    setDailyOz]    = useState(()=>ls.get('froststash_daily_oz', DAILY_OZ));
  const [editDaily,  setEditDaily]  = useState(false);
  const [dailyInput, setDailyInput] = useState('');

  const commitDaily=()=>{const v=parseFloat(dailyInput);if(!isNaN(v)&&v>0){setDailyOz(v);ls.set('froststash_daily_oz',v)}setEditDaily(false)};

  // Bag form
  const changeBagQty=d=>setBagForm(f=>({...f,qty:Math.max(1,f.qty+d)}));
  const submitBags=()=>{
    const{date,amount,qty,label,notes,brickMode,brickId,newBrickName}=bagForm;
    if(!date){toast_('Pick a date.','err');return}
    if(!amount||isNaN(+amount)||+amount<=0){toast_('Enter a valid amount.','err');return}
    if(brickMode==='new'&&!newBrickName.trim()){toast_('Name the new brick.','err');return}
    let targetBrickId=null;
    if(brickMode==='new'){const nb={id:uid(),label:newBrickName.trim(),notes:'',createdDate:date};saveBricks([nb,...bricks]);targetBrickId=nb.id}
    else if(brickMode==='existing'){targetBrickId=brickId||null}
    const newBags=Array.from({length:qty},()=>({id:uid(),date,amount:parseFloat(amount),label:label.trim(),notes:notes.trim(),brickId:targetBrickId}));
    saveBags([...newBags,...bags]);
    setBagForm(BLANK_BAG_FORM());setPanel(null);
    toast_(`${qty} bag${qty>1?'s':''} added! 🍼`);
  };

  // Brick form
  const addBrickRow=()=>setBrickForm(f=>({...f,bagRows:[...f.bagRows,{id:uid(),date:today(),amount:''}]}));
  const removeBrickRow=rid=>setBrickForm(f=>({...f,bagRows:f.bagRows.length>1?f.bagRows.filter(r=>r.id!==rid):f.bagRows}));
  const setBrickRowField=(rid,field,val)=>setBrickForm(f=>({...f,bagRows:f.bagRows.map(r=>r.id===rid?{...r,[field]:val}:r)}));
  const submitBrick=()=>{
    const{label,notes,bagRows}=brickForm;
    if(!label.trim()){toast_('Name this brick.','err');return}
    const valid=bagRows.filter(r=>r.amount!==''&&!isNaN(+r.amount)&&+r.amount>0&&r.date);
    if(!valid.length){toast_('Add at least one bag.','err');return}
    const nb={id:uid(),label:label.trim(),notes:notes.trim(),createdDate:today()};
    const newBags=valid.map(r=>({id:uid(),date:r.date,amount:parseFloat(r.amount),label:'',notes:'',brickId:nb.id}));
    saveBricks([nb,...bricks]);saveBags([...newBags,...bags]);
    setBrickForm(BLANK_BRICK_FORM());setPanel(null);
    toast_(`Brick "${nb.label}" created! 🧱`);
  };

  // Used / delete
  const markUsed=id=>{saveBags(bags.map(b=>b.id===id?{...b,usedDate:today()}:b));setMarkUsedId(null);toast_('Marked as used! ✓')};
  const unmarkUsed=id=>{saveBags(bags.map(b=>b.id===id?{...b,usedDate:undefined}:b));toast_('Restored to stash.')};
  const confirmDelete=()=>{
    if(!deleteTarget)return;
    if(deleteTarget.kind==='bag')saveBags(bags.filter(b=>b.id!==deleteTarget.id));
    else{saveBricks(bricks.filter(b=>b.id!==deleteTarget.id));saveBags(bags.map(b=>b.brickId===deleteTarget.id?{...b,brickId:null}:b))}
    setDeleteTarget(null);toast_('Deleted.');
  };

  // Derived
  const looseBags  =useMemo(()=>bags.filter(b=>!b.brickId),[bags]);
  const activeLoose=useMemo(()=>looseBags.filter(b=>!b.usedDate),[looseBags]);
  const allItems   =useMemo(()=>{
    const items=[];
    looseBags.forEach(b=>items.push({kind:'bag',data:b,date:b.date,amount:b.amount,usedDate:b.usedDate}));
    bricks.forEach(br=>items.push({kind:'brick',data:br,date:brickDate(br,bags),amount:brickOz(br,bags),usedDate:br.usedDate}));
    return items;
  },[bags,bricks,looseBags]);

  const filtered=useMemo(()=>{
    let list=[...allItems];
    if(filter==='active') list=list.filter(i=>!i.usedDate);
    if(filter==='used')   list=list.filter(i=> i.usedDate);
    if(filter==='good')   list=list.filter(i=>!i.usedDate&&daysOld(i.date)<=120);
    if(filter==='soon')   list=list.filter(i=>!i.usedDate&&daysOld(i.date)>120&&daysOld(i.date)<=180);
    if(filter==='expired')list=list.filter(i=>!i.usedDate&&daysOld(i.date)>180);
    if(typeFilter==='bag')  list=list.filter(i=>i.kind==='bag');
    if(typeFilter==='brick')list=list.filter(i=>i.kind==='brick');
    list.sort((a,b)=>sortBy==='amount'?b.amount-a.amount:new Date(a.date)-new Date(b.date));
    return list;
  },[allItems,filter,typeFilter,sortBy]);

  const activeBrickOz=useMemo(()=>bricks.filter(b=>!b.usedDate).reduce((s,br)=>s+brickOz(br,bags),0),[bricks,bags]);
  const activeBagOz  =useMemo(()=>activeLoose.reduce((s,b)=>s+b.amount,0),[activeLoose]);
  const activeOz     =activeBagOz+activeBrickOz;
  const usedOz       =useMemo(()=>bags.filter(b=>b.usedDate).reduce((s,b)=>s+b.amount,0)+bricks.filter(b=>b.usedDate).reduce((s,br)=>s+brickOz(br,bags),0),[bags,bricks]);
  const totalOz      =useMemo(()=>bags.reduce((s,b)=>s+b.amount,0),[bags]);
  const expiredCt    =useMemo(()=>allItems.filter(i=>!i.usedDate&&daysOld(i.date)>180).length,[allItems]);
  // Days of milk available from active stash
  const daysAvailable  = activeOz / dailyOz;
  const targetDateObj  = new Date(TARGET_DATE + 'T00:00:00');
  const todayDateObj   = new Date(new Date().toISOString().split('T')[0] + 'T00:00:00');
  const daysUntilBday  = Math.ceil((targetDateObj - todayDateObj) / 86400000);
  const coverUntilObj  = new Date(todayDateObj.getTime() + daysAvailable * 86400000);
  const coverUntil     = coverUntilObj.toISOString().split('T')[0];
  const fmtCoverUntil  = fmtDate(coverUntil);
  const daysShort      = Math.max(0, daysUntilBday - Math.floor(daysAvailable));
  const pct            = Math.min(100, (daysAvailable / daysUntilBday) * 100);
  const onTrack        = daysAvailable >= daysUntilBday;
  const activeBricks =useMemo(()=>bricks.filter(b=>!b.usedDate),[bricks]);

  // ── Stop-storing projection ───────────────────────────────────────────────
  // Average daily stored rate: total oz pumped / days since first bag
  const allBagDates   = useMemo(()=>bags.map(b=>b.date).sort(),[bags]);
  const firstBagDate  = allBagDates[0] || today();
  const daysSinceFirst= Math.max(1, daysOld(firstBagDate));
  const avgDailyStored= totalOz / daysSinceFirst;  // oz/day going into freezer on avg

  // Average daily used rate: used oz / days since first used bag
  const usedBags      = useMemo(()=>bags.filter(b=>b.usedDate),[bags]);
  const firstUsedDate = useMemo(()=>{const d=usedBags.map(b=>b.usedDate).sort();return d[0]||null;},[usedBags]);
  const daysSinceUsed = firstUsedDate ? Math.max(1, daysOld(firstUsedDate)) : null;
  const avgDailyUsed  = daysSinceUsed ? (usedOz / daysSinceUsed) : 0;

  // Net daily change to stash
  const netDailyRate  = avgDailyStored - avgDailyUsed;

  // Oz needed to cover Dec 30 at dailyOz consumption
  const ozNeededForGoal = daysUntilBday * dailyOz;
  const ozStillNeeded   = Math.max(0, ozNeededForGoal - activeOz);

  // If still storing (net > 0), project when stash hits goal oz
  // activeOz + netDailyRate * x = ozNeededForGoal  => x = (ozNeededForGoal - activeOz) / netDailyRate
  let stopStoringDate = null;
  let stopStoringDays = null;
  if (netDailyRate > 0 && ozStillNeeded > 0) {
    stopStoringDays = Math.ceil(ozStillNeeded / netDailyRate);
    const stopObj = new Date(todayDateObj.getTime() + stopStoringDays * 86400000);
    stopStoringDate = fmtDate(stopObj.toISOString().split('T')[0]);
  }

  const importBags=(newBags)=>{
    // Merge: add new bags, avoid wiping existing data
    const merged=[...newBags,...bags];
    saveBags(merged);
    toast_(`${newBags.length} bags imported! 🍼`);
  };

  const exportCSV=()=>{
    const hdr=['Type','Brick','Date','Amount(oz)','DaysFrozen','Status','UsedDate','Label','Notes'];
    const rows=[];
    bags.filter(b=>!b.brickId).forEach(b=>rows.push(['Bag','',fmtDate(b.date),b.amount,daysOld(b.date),freshnessLabel(b.date,b.usedDate),b.usedDate?fmtDate(b.usedDate):'',b.label,(b.notes||'').replace(/,/g,';')]));
    bricks.forEach(br=>{
      const mb=bags.filter(b=>b.brickId===br.id);
      const d=brickDate(br,bags);
      rows.push(['Brick',br.label,fmtDate(d),brickOz(br,bags).toFixed(1),daysOld(d),freshnessLabel(d,br.usedDate),br.usedDate?fmtDate(br.usedDate):'','',br.notes||'']);
      mb.forEach(b=>rows.push(['  Bag',br.label,fmtDate(b.date),b.amount,daysOld(b.date),'','','',b.notes||'']));
    });
    const csv=[hdr,...rows].map(r=>r.join(',')).join('\n');
    const a=Object.assign(document.createElement('a'),{href:URL.createObjectURL(new Blob([csv],{type:'text/csv'})),download:`milk-stash-${today()}.csv`});
    a.click();URL.revokeObjectURL(a.href);toast_('CSV exported! 📋');
  };

  const previewBagOz=bagForm.amount&&+bagForm.amount>0?(bagForm.qty * +bagForm.amount).toFixed(1):null;

  return e('div',{style:{minHeight:'100vh'}},
    // Toast
    toast && div({...S.toast,background:toast.type==='err'?'#f26b6b':'#4dba85'},toast.msg),

    // Mark used modal
    markUsedId && div(S.overlay,
      div(S.modal,
        div({fontSize:32,marginBottom:10},'✅'),
        e('p',{style:{margin:'0 0 6px',fontSize:16,fontWeight:700}},'Mark as used?'),
        e('p',{style:{margin:'0 0 20px',fontSize:13,color:'#7a9ab0'}},'It will move to your Used history.'),
        div({display:'flex',gap:10,justifyContent:'center'},
          btn(S.btnCancel,()=>setMarkUsedId(null),'Cancel'),
          btn({...S.btnGreen},()=>markUsed(markUsedId),'Mark Used')
        )
      )
    ),

    // Delete modal
    deleteTarget && div(S.overlay,
      div(S.modal,
        div({fontSize:32,marginBottom:10},'🗑️'),
        e('p',{style:{margin:'0 0 20px',fontSize:16,fontWeight:700}},deleteTarget.kind==='brick'?'Delete brick? Bags become loose.':'Delete this entry?'),
        div({display:'flex',gap:10,justifyContent:'center'},
          btn(S.btnCancel,()=>setDeleteTarget(null),'Cancel'),
          btn(S.btnDanger,confirmDelete,'Delete')
        )
      )
    ),

    // Header
    e('header',{style:S.header},
      div(S.hInner,
        div({},
          div(S.logo,span({fontSize:28},'🧊'),span(S.logoTxt,'FrostStash')),
          e('p',{style:S.tagline},'Frozen breast milk tracker')
        ),
        div(S.hActions,
          btn(S.btnExport,exportCSV,'↓ CSV'),
          panel
            ? btn(S.btnSecondary,()=>setPanel(null),'✕ Cancel')
            : e(React.Fragment,null,
                btn(S.btnPrimary,()=>{setBagForm(BLANK_BAG_FORM());setPanel('bag')},'🍼 Add Bags'),
                btn(S.btnGreen,()=>{setBrickForm(BLANK_BRICK_FORM());setPanel('brick')},'🧱 Add Brick')
              )
        )
      )
    ),

    // Main
    e('main',{style:S.main},

      // Stats
      div(S.statsRow,
        e(Stat,{icon:'🍼',label:'Loose Bags',   value:activeLoose.length}),
        e(Stat,{icon:'🧱',label:'Bricks',       value:bricks.filter(b=>!b.usedDate).length}),
        e(Stat,{icon:'📏',label:'Stash Ounces', value:`${activeOz.toFixed(1)} oz`}),
        e(Stat,{icon:'🔢',label:'Total Pumped', value:`${totalOz.toFixed(1)} oz`,accent:'#1a6fa8'}),
        e(Stat,{icon:'✅',label:'Used Ounces',  value:`${usedOz.toFixed(1)} oz`,accent:'#2d6a4f'}),
        e(Stat,{icon:'📅',label:'Days of Milk', value:`${Math.floor(daysAvailable)}d`,accent:onTrack?'#4dba85':undefined})
      ),

      // Goal bar
      div(S.goalBar,
        div(S.goalTop,
          span({fontSize:14,fontWeight:700},'🍼 Milk Coverage'),
          div({display:'flex',alignItems:'center',gap:8,flexWrap:'wrap'},
            span({fontSize:13,color:'#456070',fontWeight:600},
              `${activeOz.toFixed(1)} oz ÷ `,
              editDaily
                ? e(React.Fragment, null,
                    inp({...S.input,width:60,padding:'4px 8px',fontSize:13,display:'inline-block'},{type:'number',min:'1',step:'1',autoFocus:true,value:dailyInput,onChange:ev=>setDailyInput(ev.target.value),onKeyDown:ev=>{if(ev.key==='Enter')commitDaily();if(ev.key==='Escape')setEditDaily(false)}}),
                    span({fontSize:13,color:'#9bb5c4'},' oz/day'),
                    btn(S.btnGoalSave,commitDaily,'✓'),
                    btn({background:'none',border:'none',color:'#aac0ce',fontSize:13,cursor:'pointer'},()=>setEditDaily(false),'✕')
                  )
                : e(React.Fragment, null,
                    span({},`${dailyOz} oz/day`),
                    btn({background:'none',border:'none',cursor:'pointer',fontSize:12},()=>{setDailyInput(String(dailyOz));setEditDaily(true)},'✏️')
                  )
            )
          )
        ),
        div(S.goalTrack,
          div({height:'100%',borderRadius:8,transition:'width .5s ease',width:`${pct}%`,
            background:onTrack?'#4dba85':pct>=70?'#f5a742':'#f26b6b'})
        ),
        div({display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:4,marginTop:6},
          e('p',{style:{fontSize:12,color:'#7a9ab0'}},
            onTrack
              ? `🎉 Covered until ${fmtCoverUntil} — past his birthday!`
              : `📅 Covered until ${fmtCoverUntil} · ${daysShort} days short of Dec 30`
          ),
          e('p',{style:{fontSize:12,color:'#7a9ab0'}},`🎂 ${daysUntilBday} days until Dec 30`)
        )
      ),

      // Import panel
      e(ImportPanel,{onImport:importBags}),

      // Stop-storing projection panel
      div({...S.goalBar, marginBottom:18, borderColor: onTrack?'#a8d5be':'#f5c6c6'},
        div({...S.goalTop, marginBottom:12},
          span({fontSize:14,fontWeight:700},'📊 Stash Projection'),
          span({fontSize:12,color:'#7a9ab0'},'based on your averages')
        ),
        div({display:'grid',gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))',gap:12,marginBottom:12},
          // Daily stored rate
          div({background:'#f0f8ff',borderRadius:10,padding:'12px',border:'1.5px solid #d4eaf7'},
            div({fontSize:11,color:'#7a9ab0',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4},'Avg Daily Stored'),
            div({fontSize:20,fontWeight:700,color:'#1a6fa8'},`${avgDailyStored.toFixed(1)} oz/day`),
            div({fontSize:11,color:'#9bb5c4'},`over ${daysSinceFirst} days`)
          ),
          // Daily used rate
          div({background:'#f0faf4',borderRadius:10,padding:'12px',border:'1.5px solid #c8e6d4'},
            div({fontSize:11,color:'#7a9ab0',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4},'Avg Daily Used'),
            div({fontSize:20,fontWeight:700,color:'#2d6a4f'},avgDailyUsed>0?`${avgDailyUsed.toFixed(1)} oz/day`:'No data yet'),
            div({fontSize:11,color:'#9bb5c4'},daysSinceUsed?`over ${daysSinceUsed} days`:'Mark bags as used to track')
          ),
          // Net rate
          div({background: netDailyRate>0?'#f0faf4':'#fff5f5',borderRadius:10,padding:'12px',border:`1.5px solid ${netDailyRate>0?'#c8e6d4':'#f5c6c6'}`},
            div({fontSize:11,color:'#7a9ab0',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4},'Net Daily Rate'),
            div({fontSize:20,fontWeight:700,color:netDailyRate>0?'#2d6a4f':'#f26b6b'},
              `${netDailyRate>=0?'+':''}${netDailyRate.toFixed(1)} oz/day`),
            div({fontSize:11,color:'#9bb5c4'},netDailyRate>0?'Stash is growing':'Stash is shrinking')
          ),
          // Oz needed
          div({background: ozStillNeeded===0?'#f0faf4':'#f4f9fd',borderRadius:10,padding:'12px',border:`1.5px solid ${ozStillNeeded===0?'#c8e6d4':'#d4eaf7'}`},
            div({fontSize:11,color:'#7a9ab0',textTransform:'uppercase',letterSpacing:'0.06em',marginBottom:4},'Still Needed'),
            div({fontSize:20,fontWeight:700,color:ozStillNeeded===0?'#2d6a4f':'#1a6fa8'},
              ozStillNeeded===0?'Goal met!':  `${ozStillNeeded.toFixed(0)} oz`),
            div({fontSize:11,color:'#9bb5c4'},ozStillNeeded===0?`${(activeOz-ozNeededForGoal).toFixed(0)} oz surplus`:`to cover until Dec 30`)
          )
        ),
        // Stop-storing projection
        div({background: onTrack?'#e8f7ee':stopStoringDate?'#e8f4fd':'#fff5f5', borderRadius:10, padding:'14px', border:`1.5px solid ${onTrack?'#a8d5be':stopStoringDate?'#b8d8f0':'#f5c6c6'}`},
          onTrack
            ? e('p',{style:{fontSize:14,fontWeight:700,color:'#2d6a4f',margin:'0 0 4px'}},
                '🎉 You can stop storing now!')
            : stopStoringDate
              ? e('p',{style:{fontSize:14,fontWeight:700,color:'#1a6fa8',margin:'0 0 4px'}},
                  `🛑 You can stop storing around `,e('strong',null,stopStoringDate))
              : e('p',{style:{fontSize:14,fontWeight:700,color:'#f26b6b',margin:'0 0 4px'}},
                  '⚠️ At current rate, stash may not reach goal'),
          e('p',{style:{fontSize:12,color:'#7a9ab0',margin:0}},
            onTrack
              ? `Your ${activeOz.toFixed(0)} oz active stash covers all ${daysUntilBday} days until Dec 30.`
              : stopStoringDate
                ? `At +${netDailyRate.toFixed(1)} oz/day net, you need ${stopStoringDays} more days to accumulate the remaining ${ozStillNeeded.toFixed(0)} oz.`
                : `You're using more than storing (${netDailyRate.toFixed(1)} oz/day net). Keep pumping to freeze!`
          )
        )
      ),

      // Sync panel
      e(GistSyncPanel,{gistUrl,status:syncStatus,message:syncMsg,onSave:saveToGist,onLoad:loadFromGist,onClear:clearStatus}),

      // Add Bags panel
      panel==='bag' && div({...S.formCard,className:'slide-in'},
        e('h2',{style:{...S.formTitle,margin:'0 0 14px',fontSize:19,fontWeight:700,color:'#1a6fa8'}},'🍼 Add Bags'),
        div(S.formGrid,
          e('label',{style:S.lbl},'Date Pumped',inp(S.input,{type:'date',value:bagForm.date,max:today(),onChange:ev=>setBagForm(f=>({...f,date:ev.target.value}))})),
          e('label',{style:S.lbl},'Amount per bag (oz)',
            div({position:'relative'},
              inp({...S.input,paddingRight:34},{type:'number',min:'0.5',step:'0.5',placeholder:'0.0',value:bagForm.amount,onChange:ev=>setBagForm(f=>({...f,amount:ev.target.value}))}),
              span({position:'absolute',right:10,top:'50%',transform:'translateY(-50%)',fontSize:13,color:'#9bb5c4',pointerEvents:'none'},'oz')
            )
          ),
          e('label',{style:{...S.lbl,alignItems:'center'}},'# of bags',
            div(S.stepper,
              btn(S.stepBtn,()=>changeBagQty(-1),'−'),
              div(S.stepVal,bagForm.qty),
              btn(S.stepBtn,()=>changeBagQty(+1),'+')
            )
          ),
          e('label',{style:S.lbl},'Label',inp(S.input,{type:'text',placeholder:'e.g. Morning',value:bagForm.label,onChange:ev=>setBagForm(f=>({...f,label:ev.target.value}))})),
          e('label',{style:{...S.lbl,gridColumn:'1/-1'}},'Notes',inp(S.input,{type:'text',placeholder:'Optional',value:bagForm.notes,onChange:ev=>setBagForm(f=>({...f,notes:ev.target.value}))}))
        ),
        // Brick assignment
        div(S.brickAssign,
          e('p',{style:{fontSize:13,fontWeight:700,color:'#456070',margin:'0 0 10px'}},'Add to a brick? ',span({fontWeight:400,color:'#9bb5c4',fontSize:12},'(optional)')),
          div({display:'flex',gap:8,flexWrap:'wrap',marginBottom:10},
            ...[['none','No brick'],['existing','Existing brick'],['new','New brick']].map(([v,l])=>
              btn({...S.modeBtn,...(bagForm.brickMode===v?S.modeBtnActive:{})},()=>setBagForm(f=>({...f,brickMode:v,brickId:'',newBrickName:''})),l)
            )
          ),
          bagForm.brickMode==='existing' && (
            activeBricks.length===0
              ? e('p',{style:{fontSize:13,color:'#9bb5c4',margin:0}},'No active bricks yet.')
              : e('select',{style:{...S.input},value:bagForm.brickId,onChange:ev=>setBagForm(f=>({...f,brickId:ev.target.value}))},
                  e('option',{value:''},'— Select a brick —'),
                  ...activeBricks.map(br=>e('option',{key:br.id,value:br.id},`${br.label} (${bags.filter(b=>b.brickId===br.id).length} bags, ${brickOz(br,bags).toFixed(1)} oz)`))
                )
          ),
          bagForm.brickMode==='new' && inp(S.input,{type:'text',placeholder:'Brick name (e.g. Brick #4)',value:bagForm.newBrickName,onChange:ev=>setBagForm(f=>({...f,newBrickName:ev.target.value}))})
        ),
        previewBagOz && div(S.preview,
          `🍼 ${bagForm.qty} bag${bagForm.qty>1?'s':''}`,span({color:'#c4d8e8'},'·'),e('strong',null,`${previewBagOz} oz`),
          bagForm.brickMode==='existing'&&bagForm.brickId ? [span({color:'#c4d8e8'},'·'),`→ ${activeBricks.find(b=>b.id===bagForm.brickId)?.label||''}`] : null,
          bagForm.brickMode==='new'&&bagForm.newBrickName ? [span({color:'#c4d8e8'},'·'),`→ new "${bagForm.newBrickName}"`] : null
        ),
        btn(S.btnPrimary,submitBags,`Add ${bagForm.qty} Bag${bagForm.qty>1?'s':''} to Stash`)
      ),

      // Add Brick panel
      panel==='brick' && div({...S.formCard,borderColor:'#a8d5be',className:'slide-in'},
        e('h2',{style:{margin:'0 0 14px',fontSize:19,fontWeight:700,color:'#2d6a4f'}},'🧱 Create Brick'),
        div(S.formGrid,
          e('label',{style:S.lbl},'Brick Name *',inp(S.input,{type:'text',placeholder:'e.g. Brick #1',value:brickForm.label,onChange:ev=>setBrickForm(f=>({...f,label:ev.target.value}))})),
          e('label',{style:S.lbl},'Notes',inp(S.input,{type:'text',placeholder:'Optional',value:brickForm.notes,onChange:ev=>setBrickForm(f=>({...f,notes:ev.target.value}))}))
        ),
        div({...S.bagsBox,background:'#f0faf4',borderColor:'#a8d5be'},
          div({display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:12},
            span({fontSize:13,fontWeight:700},'Bags ',span(S.bagCountPill,brickForm.bagRows.length)),
            btn({background:'rgba(45,106,79,0.1)',color:'#2d6a4f',border:'1.5px dashed #7ab89a',borderRadius:8,padding:'5px 12px',fontSize:12,fontWeight:700,cursor:'pointer'},addBrickRow,'+ Add bag')
          ),
          div({display:'flex',flexDirection:'column',gap:8},
            ...brickForm.bagRows.map((row,i)=>
              div({display:'flex',gap:8,alignItems:'center',flexWrap:'wrap',key:row.id},
                span({fontSize:12,fontWeight:700,color:'#9bb5c4',minWidth:22,textAlign:'right'},`#${i+1}`),
                inp({...S.input,flex:'1 1 130px',fontSize:13},{type:'date',value:row.date,max:today(),onChange:ev=>setBrickRowField(row.id,'date',ev.target.value)}),
                div({position:'relative',flex:'1 1 90px'},
                  inp({...S.input,paddingRight:32,fontSize:13},{type:'number',min:'0.5',step:'0.5',placeholder:'oz',value:row.amount,onChange:ev=>setBrickRowField(row.id,'amount',ev.target.value)}),
                  span({position:'absolute',right:8,top:'50%',transform:'translateY(-50%)',fontSize:13,color:'#9bb5c4',pointerEvents:'none'},'oz')
                ),
                brickForm.bagRows.length>1 && btn({background:'none',border:'none',color:'#c0d5e4',fontSize:14,cursor:'pointer',padding:'4px 6px',borderRadius:6,lineHeight:1},()=>removeBrickRow(row.id),'✕')
              )
            )
          ),
          (()=>{
            const valid=brickForm.bagRows.filter(r=>r.amount&&+r.amount>0&&r.date);
            if(!valid.length)return null;
            const totalBrickOz=valid.reduce((s,r)=>s+(+r.amount),0);
            return div({...S.preview,marginTop:12,marginBottom:0},
              `🧱 ${valid.length} bag${valid.length>1?'s':''}`,span({color:'#c4d8e8'},'·'),
              e('strong',null,`${totalBrickOz.toFixed(1)} oz`),span({color:'#c4d8e8'},'·'),
              `oldest: ${fmtDate(minDate(valid.map(r=>r.date)))}`
            );
          })()
        ),
        btn({...S.btnGreen},submitBrick,'Create Brick')
      ),

      // Filters
      div(S.controls,
        div({display:'flex',gap:6,flexWrap:'wrap'},
          div(S.filters,
            ...[['active','🧊 Active'],['used','✅ Used'],['all','All'],['good','🟢 Good'],['soon','⚠️ Soon'],['expired','🚫 Expired']].map(([v,l])=>
              btn({...S.filterBtn,...(filter===v?(v==='used'?S.fUsed:S.fActive):{})},()=>setFilter(v),l)
            )
          ),
          div(S.filters,
            ...[['all','All'],['bag','🍼'],['brick','🧱']].map(([v,l])=>
              btn({...S.filterBtn,...(typeFilter===v?(v==='brick'?S.fBrick:S.fActive):{})},()=>setTypeFilter(v),l)
            )
          )
        ),
        e('select',{style:S.select,value:sortBy,onChange:ev=>setSortBy(ev.target.value)},
          e('option',{value:'date'},'Sort: Oldest first'),
          e('option',{value:'amount'},'Sort: Largest first')
        )
      ),

      // List
      filtered.length===0
        ? div(S.empty,span({fontSize:48,display:'block',marginBottom:12},'🧊'),e('p',{style:{color:'#8aabb8',fontSize:15,fontStyle:'italic'}},allItems.length===0?'Your stash is empty — add your first bags or bricks!':'No entries match this filter.'))
        : div({display:'flex',flexDirection:'column',gap:10},
            ...filtered.map(item=>{
              const{kind,data,date,amount,usedDate}=item;
              const isBrick=kind==='brick';
              const color=freshnessColor(date,usedDate);
              const myBags=isBrick?bags.filter(b=>b.brickId===data.id):[];
              const isExpanded=expandBrick===data.id;
              return div({...S.entry,...(usedDate?S.entryUsed:{}),...(isBrick?{borderColor:'#c8e6d4'}:{}),className:'entry-card',key:data.id},
                div({...S.stripe,background:color}),
                div({flex:1,minWidth:0},
                  div(S.entryTop,
                    span({...S.typePill,background:isBrick?'#d8f3e6':'#e8f4fd',color:isBrick?'#2d6a4f':'#1a6fa8',border:`1px solid ${isBrick?'#a8d5be':'#b8d8f0'}`},isBrick?'🧱 Brick':'🍼 Bag'),
                    isBrick?span({fontSize:13,fontWeight:700,color:'#2d6a4f'},data.label):span({fontSize:13,fontWeight:600,color:'#1a2e3b'},`📅 ${fmtDate(date)}`),
                    !isBrick&&data.label&&span(S.entryTag,data.label),
                    span({...S.badge,background:color+'22',color,border:`1px solid ${color}55`},freshnessLabel(date,usedDate)),
                    usedDate&&span({fontSize:11,color:'#8aabb8',fontStyle:'italic'},`used ${fmtDate(data.usedDate)}`)
                  ),
                  div(S.entryMeta,
                    span({fontSize:17,fontWeight:700,color:usedDate?'#a0b4c0':isBrick?'#2d6a4f':'#1a6fa8'},`${amount.toFixed(1)} oz`),
                    isBrick&&span({fontSize:12,color:'#2d6a4f',fontWeight:600,background:'#d8f3e6',borderRadius:5,padding:'1px 7px'},`${myBags.length} bag${myBags.length!==1?'s':''} · oldest ${fmtDate(date)}`),
                    !isBrick&&span({fontSize:12,color:'#8aabb8'},`${daysOld(date)} days frozen`),
                    data.notes&&span({fontSize:12,color:'#8aabb8',fontStyle:'italic'},`— ${data.notes}`)
                  ),
                  isBrick&&isExpanded&&myBags.length>0&&div(S.brickBagList,
                    ...myBags.map(b=>div({...S.brickBagRow,key:b.id},
                      span({fontSize:12,color:'#6a8a9b'},`📅 ${fmtDate(b.date)}`),
                      span({fontSize:13,fontWeight:600,color:'#2d6a4f'},`${b.amount} oz`),
                      span({fontSize:11,color:'#8aabb8'},`${daysOld(b.date)}d frozen`),
                      !usedDate&&btn({...S.btnDel,fontSize:12},()=>setDeleteTarget({id:b.id,kind:'bag'}),'✕')
                    ))
                  ),
                  isBrick&&btn(S.expandBtn,()=>setExpandBrick(isExpanded?null:data.id),`${isExpanded?'▲ Hide':'▼ Show'} bags (${myBags.length})`)
                ),
                div({display:'flex',flexDirection:'column',gap:4,flexShrink:0},
                  !usedDate&&btn(S.btnMarkUsed,()=>isBrick?(saveBricks(bricks.map(b=>b.id===data.id?{...b,usedDate:today()}:b)),toast_('Brick marked as used! ✓')):setMarkUsedId(data.id),'✓'),
                  usedDate&&btn(S.btnUnmark,()=>isBrick?(saveBricks(bricks.map(b=>b.id===data.id?{...b,usedDate:undefined}:b)),toast_('Brick restored.')):unmarkUsed(data.id),'↩'),
                  btn(S.btnDel,()=>setDeleteTarget({id:data.id,kind}),'✕')
                )
              );
            })
          ),

      // Legend
      div(S.legend,
        ...[['#4dba85','Good (≤4 mo)'],['#f5a742','Use soon (4–6 mo)'],['#f26b6b','Expired (>6 mo)'],['#a0b4c0','Used']].map(([c,l])=>
          e('span',{key:c,style:{display:'flex',alignItems:'center'}},span({...S.dot,background:c}),l)
        )
      )
    )
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(e(MilkTracker));
</script>
</body>
</html>
